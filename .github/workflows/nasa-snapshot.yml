name: Refresh NASA exoplanet snapshot

# Manual only: run it from the Actions tab when a fresh dated snapshot is wanted.
# (It used to run whenever this file changed on main, which commits data as a side effect of editing CI.)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Get real NASA TAP data (no fixture or fallback)
        run: npm run snapshot
      - name: Check the app still builds and tests pass with the new snapshot
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Commit the dated snapshot to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/planets-*.json
          git diff --cached --quiet && { echo "No change in the snapshot."; exit 0; }
          git commit -m "data(story): refresh NASA pscomppars snapshot"
          git push origin HEAD:main
